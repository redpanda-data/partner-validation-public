# Partner production model — Topic A driver, ACKS=0 VARIANT (fire-and-forget)
name: Redpanda
driverClass: io.openmessaging.benchmark.driver.redpanda.RedpandaBenchmarkDriver
replicationFactor: 3
topicConfig: |
  min.insync.replicas=2
  compression.type=producer
  redpanda.remote.write=true
  redpanda.remote.read=true
  retention.local.target.bytes=21474836480
commonConfig: |
  bootstrap.servers=BROKER_IPS_PLACEHOLDER
producerConfig: |
  acks=0
  linger.ms=5
  batch.size=1048576
  compression.type=none
  max.in.flight.requests.per.connection=5
  # idempotence off: required with acks=0
  enable.idempotence=false
consumerConfig: |
  auto.offset.reset=earliest
  enable.auto.commit=false
  max.partition.fetch.bytes=8388608
  fetch.max.bytes=134217728
  fetch.min.bytes=65536
  fetch.max.wait.ms=100
