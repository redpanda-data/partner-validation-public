# Redpanda on OKE — DenseIO E4 Flex16 variant (16 OCPU / 256 GB / 2x NVMe)
# Differences from redpanda-values-nvme.yaml:
#   - resources sized for 32 vCPU / 256 GB nodes (30 cores, 200 Gi)
#   - PV 12000 Gi on the RAID-0 of both NVMe devices (~13.6 TB usable)
statefulset:
  replicas: 6

resources:
  cpu:
    cores: 30
  memory:
    container:
      max: 200Gi

tuning:
  tune_aio_events: true

storage:
  persistentVolume:
    enabled: true
    size: 12000Gi
    storageClass: nvme-local
  tiered:
    config:
      cloud_storage_enabled: true
      cloud_storage_region: us-ashburn-1
      cloud_storage_bucket: redpanda-tiered-benchmark
      cloud_storage_api_endpoint: <OS_NAMESPACE>.compat.objectstorage.us-ashburn-1.oraclecloud.com
      cloud_storage_api_endpoint_port: 443
      cloud_storage_disable_tls: false
      cloud_storage_url_style: path
      # access/secret via --set-string at deploy (providers/oci/.env.tiered-storage)

tls:
  enabled: false

external:
  enabled: true
  type: NodePort

listeners:
  kafka:
    port: 9093
    external:
      default:
        port: 9094
        advertisedPorts:
          - 31092
  admin:
    port: 9644
    external:
      default:
        port: 9645
        advertisedPorts:
          - 31644
  http:
    enabled: false
  rpc:
    port: 33145
  schemaRegistry:
    enabled: false

console:
  enabled: false

monitoring:
  enabled: false

post_install_job:
  enabled: true
